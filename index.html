<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>樂園大亨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 明亮熱鬧的經典遊樂園經營遊戲
   IDEA: 一張會動的遊樂園導覽地圖，介面像園區的招牌與售票亭
   PICTURE: 等角視角的浮島園區佔滿畫面，設施、軌道、遊客都在上面活動
   COLOUR and TYPE: 天空藍底、草地綠、糖果紅主色、陽光黃強調；Noto Sans TC + Fredoka 數字
   LAYOUT: 全螢幕地圖，上方狀態列、下方工具列、右側資訊面板（窄螢幕改為底部抽屜） */
:root{color-scheme:light dark;--bg:light-dark(#bfe6fa,#0f1c2b);--sky2:light-dark(#e8f7ff,#1b2d40);--panel:light-dark(#fffdf6,#1c2432);--ink:light-dark(#1d2433,#eef2f8);--mute:light-dark(#5b6475,#9aa6b8);--line:light-dark(#ebe3cf,#2e3a4d);--chip:light-dark(#f3eee0,#263043);--red:#e8453c;--yel:#ffc83d;--grn:light-dark(#2b8a3e,#69db7c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Noto Sans TC",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.num{font-family:Fredoka,"Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:var(--chip);border-radius:10px;padding:6px 12px;min-height:40px;cursor:pointer}
button:hover:not(:disabled){filter:brightness(.95)}
button:focus-visible{outline:3px solid var(--yel);outline-offset:1px}
button.on{background:var(--red);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
#top{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:6px;align-items:stretch;flex-wrap:wrap;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.pill{background:var(--panel);border-radius:12px;padding:5px 12px;box-shadow:0 2px 0 rgba(0,0,0,.12),0 6px 18px rgba(0,0,0,.08);display:flex;gap:6px;align-items:center;white-space:nowrap;min-height:40px}
button.pill{padding:5px 12px}
.pill small{color:var(--mute);font-size:13px}
.pill b{font-size:18px}
#pname{background:var(--red);color:#fff;font-weight:900;font-size:16px}
#cash.neg{color:var(--red)}
.spd{padding:3px;gap:2px}
.spd button{min-height:34px;padding:2px 10px;background:transparent;font-weight:700}
.spd button.on{background:var(--red);color:#fff}
#tools{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:2px;background:var(--panel);padding:5px;border-radius:16px;box-shadow:0 3px 0 rgba(0,0,0,.12),0 10px 28px rgba(0,0,0,.14);max-width:calc(100% - 16px);overflow-x:auto;z-index:5;scrollbar-width:none}
#tools button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:700;min-width:58px;padding:5px 6px;background:transparent;flex:none}
#tools svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tools button.on{background:var(--red);color:#fff}
#hint{position:fixed;top:62px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;border-radius:12px;padding:6px 8px 6px 14px;display:flex;gap:8px;align-items:center;z-index:6;max-width:calc(100% - 16px);box-shadow:0 6px 18px rgba(0,0,0,.2)}
#hint[hidden]{display:none}
#hint span{font-size:14px}
#hint button{min-height:34px;padding:2px 10px;background:#39435a;color:#fff;flex:none}
#panel{position:fixed;right:10px;top:62px;width:350px;max-height:calc(100% - 150px);background:var(--panel);border-radius:16px;box-shadow:0 3px 0 rgba(0,0,0,.12),0 12px 32px rgba(0,0,0,.16);display:flex;flex-direction:column;overflow:hidden;z-index:4}
#panel[hidden]{display:none}
.ph{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;background:var(--yel);color:#2a2200}
.ph b{flex:1;font-size:17px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph button{background:rgba(255,255,255,.65);min-height:34px;padding:2px 12px;color:#2a2200}
#pbody{padding:12px 14px 14px;overflow-y:auto;overscroll-behavior:contain}
#pbody h4{margin:14px 0 6px;font-size:14px;color:var(--mute)}
#pbody h4:first-child{margin-top:0}
#pbody p{margin:4px 0 8px}
.mute{color:var(--mute);font-size:13px}
.list{display:grid;gap:4px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;text-align:start;padding:8px 12px;background:var(--chip)}
.item .nm{font-weight:700}
.item .sub{grid-column:1;font-size:12.5px;color:var(--mute)}
.item .pr{grid-row:1/3;grid-column:2;align-self:center;font-weight:700}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:14px}
.kv>:nth-child(odd){color:var(--mute)}
.kv>:nth-child(even){text-align:end;font-weight:700}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.row>button{flex:1 1 auto}
.price{display:flex;align-items:center;gap:6px;margin:6px 0}
.price b{min-width:62px;text-align:center;font-size:18px}
.price button{min-width:44px}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin:2px 0 6px}
.bar i{display:block;height:100%;background:var(--grn);border-radius:5px}
.bar.r i{background:var(--red)}
.need{display:grid;grid-template-columns:4.5em minmax(0,1fr) 2.5em;gap:6px;align-items:center;font-size:13px}
.need .bar{margin:0}
.big{font-size:40px;font-weight:700;line-height:1}
.th{list-style:none;padding:0;margin:4px 0}
.th li{padding:5px 10px;background:var(--chip);border-radius:8px;margin-bottom:4px;font-size:13.5px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:20px;background:var(--chip);font-weight:700}
.tag.ok{background:#d3f9d8;color:#1b5e20}.tag.bad{background:#ffe3e3;color:#a61e1e}.tag.warn{background:#fff3bf;color:#7a5b00}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.grid3 button{padding:6px 4px;font-weight:700;font-size:14px}
table.fin{width:100%;border-collapse:collapse;font-size:13px}
table.fin td,table.fin th{padding:4px 4px;text-align:end;border-bottom:1px solid var(--line);white-space:nowrap}
table.fin td:first-child,table.fin th:first-child{text-align:start}
.pos{color:var(--grn)}.negv{color:var(--red)}
#ticker{position:fixed;left:10px;bottom:86px;display:flex;flex-direction:column;gap:4px;z-index:3;max-width:min(420px,calc(100% - 20px))}
#ticker div{background:rgba(29,36,51,.88);color:#fff;padding:6px 12px;border-radius:10px;font-size:13.5px;cursor:pointer;animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
#modal{position:fixed;inset:0;background:rgba(10,20,35,.45);display:grid;place-items:center;z-index:20;padding:16px}
#modal[hidden]{display:none}
.card{background:var(--panel);border-radius:20px;max-width:760px;width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.card .hero{background:linear-gradient(160deg,#ff6b5e,#e8453c 55%,#c92a2a);color:#fff;padding:26px 26px 22px;position:relative;overflow:hidden}
.card .hero h1{margin:0;font-size:46px;line-height:1.05;font-weight:900;letter-spacing:.02em}
.card .hero p{margin:8px 0 0;font-size:16px;opacity:.95}
.card .hero svg{position:absolute;right:-10px;bottom:-6px;width:280px;height:130px;opacity:.95}
.card .in{padding:18px 22px 22px}
.scns{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.scn{display:flex;flex-direction:column;align-items:flex-start;text-align:start;gap:4px;padding:14px;border:2px solid transparent;background:var(--chip)}
.scn:hover{border-color:var(--yel)}
.scn b{font-size:18px}
.scn span{font-size:13px;color:var(--mute)}
.scn em{font-style:normal;font-size:13px;font-weight:700;color:var(--red)}
.help{font-size:13.5px;color:var(--mute);margin-top:14px;line-height:1.7}
@media(max-width:720px){
 #panel{left:8px;right:8px;width:auto;top:auto;bottom:84px;max-height:48vh}
 .pill{padding:4px 9px;min-height:36px}.pill b{font-size:15px}.pill small{font-size:12px}
 #pname{display:none}
 #hint{top:auto;bottom:84px}
 #ticker{bottom:auto;top:96px}
 .card .hero h1{font-size:34px}.card .hero svg{display:none}
}
@media(prefers-reduced-motion:reduce){#ticker div{animation:none}}
</style>
</head>

<script>
{
'use strict';
const $=s=>document.querySelector(s);
const N=48,HZ=14,DAY_LEN=20,DPM=8,MAXH=24;
const DX=[1,0,-1,0],DY=[0,1,0,-1],ARROW=['↘','↙','↖','↗'];
const MONTHS=['三月','四月','五月','六月','七月','八月','九月','十月'];
const idx=(x,y)=>y*N+x,inb=(x,y)=>x>=0&&y>=0&&x<N&&y<N;
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[Math.floor(Math.random()*a.length)];
const money=n=>(n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=(a,b)=>{let h=Math.imul(a,374761393)+Math.imul(b,668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296};
const lvl=v=>v<2.5?'低':v<5?'中':v<7?'高':v<9?'非常高':'極高';

// ===== 資料定義 =====
const RIDE_DEFS={

 {name:'青草綠地',park:'青草樂園',desc:'平坦的草地和一座小湖，適合新手熟悉操作。',cash:10000,loan:10000,fee:10,goal:{guests:250,rating:600,year:1},gen:()=>{lake(32,14,4.5);lake(35,18,3);trees(70)}},

 {name:'密林探險',park:'森林樂園',desc:'茂密森林裡資金吃緊，要精打細算。',cash:6000,loan:12000,fee:8,goal:{guests:650,rating:700,year:3},gen:()=>{lake(38,10,4);trees(560)}},
];

const UI={tool:{mode:'select'},panel:null,hover:null,sel:null,modal:false,pdown:false};
const GM=new Map(),CC=new Map();
const LS={ride:[],shop:[],coaster:[],scen:[],gate:[]};

const beauty=new Uint8Array(N*N),secMap=new Uint8Array(N*N),entMap=new Uint8Array(N*N);
const attrList=()=>LS.ride.concat(LS.coaster);

function blankFin(){const o={};for(const[k]of FIN_CATS)o[k]=0;return o}

 S={v:1,si,name:sc.park,cash:sc.cash,loan:sc.loan,t:0,dayT:0,day:0,month:0,year:1,speed:1,secT:0,spawnAcc:0,
  terr:new Uint8Array(N*N),path:new Uint8Array(N*N),occ:new Int32Array(N*N),addon:new Uint8Array(N*N),brk:new Uint8Array(N*N),lit:new Uint8Array(N*N),vom:new Uint8Array(N*N),
  objs:{},nid:1,gid:1,sid:1,guests:[],staff:[],fee:sc.fee,open:true,rating:450,avgHappy:60,dirty:0,vomitN:0,unl:{},
  res:{fund:200,cats:{gentle:1,thrill:1,coaster:1,water:1,shop:1},pts:0,done:[]},
  fin:{cur:blankFin(),hist:[]},stat:{in:0,out:0,turned:0},tc:{},goal:sc.goal,ended:false,EY:Math.floor(N/2),spawn:0};

 for(const dy of[-1,1]){const i=idx(1,S.EY+dy);if(S.occ[i])delObj(S.objs[S.occ[i]]);S.terr[i]=0;addObj({type:'gate',x:1,y:S.EY+dy,side:dy})}

function lake(cx,cy,r){for(let y=0;y<N;y++)for(let x=0;x<N;x++){const d=Math.hypot(x-cx,y-cy)+(hash(x,y)-0.5)*1.6;if(d<r&&x>3&&!(x<=10&&Math.abs(y-N/2)<=2))S.terr[idx(x,y)]=1}}
function trees(n){for(let k=0,m=n*3;k<m&&n>0;k++){const x=ri(3,N-1),y=ri(0,N-1),i=idx(x,y);if(S.terr[i]||S.occ[i]||(x<=12&&Math.abs(y-N/2)<=3))continue;addObj({type:'scen',kind:pick(['pine','pine','oak','bush']),x,y});n--}}
function rebuildLists(){for(const k in LS)LS[k]=[];if(!S)return;for(const id in S.objs){const o=S.objs[id];LS[o.type].push(o)}}
function addObj(o){o.id=S.nid++;S.objs[o.id]=o;for(const i of foot(o))S.occ[i]=o.id;LS[o.type].push(o);return o}
function foot(o){const r=[];if(o.type==='coaster')return r;const w=o.w||1,h=o.h||1;for(let y=o.y;y<o.y+h;y++)for(let x=o.x;x<o.x+w;x++)r.push(idx(x,y));return r}
function delObj(o){for(const i of foot(o))if(S.occ[i]===o.id)S.occ[i]=0;delete S.objs[o.id];const a=LS[o.type],k=a.indexOf(o);if(k>=0)a.splice(k,1)}
function afterChange(){rebuildLists();rebuildTrack();recomputeAccess();recomputeBeauty()}
function rebuildTrack(){trackAt=new Array(N*N).fill(null);for(const c of LS.coaster)c.pieces.forEach((p,pi)=>{const i=idx(p.x,p.y),h1=p.h0+DH[p.t];(trackAt[i]||(trackAt[i]=[])).push({c:c.id,pi,lo:Math.min(p.h0,h1),hi:Math.max(p.h0,h1)})})}
function recomputeAccess(){
 const tilesOf=o=>o.type==='coaster'?o.pieces.filter(p=>p.t==='station').map(p=>idx(p.x,p.y)):foot(o);
 for(const o of LS.ride.concat(LS.shop,LS.coaster)){const fs=new Set(tilesOf(o)),acc=new Set();for(const i of fs){const x=i%N,y=i/N|0;for(let d=0;d<4;d++){const nx=x+DX[d],ny=y+DY[d];if(!inb(nx,ny))continue;const j=idx(nx,ny);if(!fs.has(j)&&S.path[j])acc.add(j)}}o.acc=[...acc]}
}
function recomputeBeauty(){beauty.fill(0);for(const o of LS.scen){const b=SCEN_DEFS[o.kind].b;for(let y=o.y-2;y<=o.y+2;y++)for(let x=o.x-2;x<=o.x+2;x++)if(inb(x,y)){const i=idx(x,y);beauty[i]=Math.min(255,beauty[i]+b)}}}

// ===== 財務與訊息 =====
function earn(v,c){S.cash+=v;S.fin.cur[c]+=v}
function pay(v,c){S.cash-=v;S.fin.cur[c]-=v}
function spend(v,c){if(S.cash<v){msg('資金不足！可到「財務」增加貸款');return false}pay(v,c);return true}
function msg(text,tile){if(!S)return;S.msgs=S.msgs||[];S.msgs.push({text,tile:tile??-1,at:performance.now()});if(S.msgs.length>40)S.msgs.shift();renderTicker()}
let lastTk='';function renderTicker(){const now=performance.now();const m=(S&&S.msgs||[]).filter(m=>now-m.at<9000).slice(-4);const h=m.map(x=>`<div data-tile="${x.tile}">${esc(x.text)}</div>`).join('');if(h!==lastTk){$('#ticker').innerHTML=h;lastTk=h}}

// ===== 尋路 =====
const bD=new Int32Array(N*N),bP=new Int32Array(N*N),bQ=new Int32Array(N*N);let bS=-1;
function bfs(st){bD.fill(-1);bS=st;if(!S.path[st])return;bD[st]=0;bP[st]=-1;let h=0,t=0;bQ[t++]=st;while(h<t){const c=bQ[h++],x=c%N,y=c/N|0,nd=bD[c]+1;for(let d=0;d<4;d++){const nx=x+DX[d],ny=y+DY[d];if(nx<0||ny<0||nx>=N||ny>=N)continue;const ni=ny*N+nx;if(bD[ni]<0&&S.path[ni]){bD[ni]=nd;bP[ni]=c;bQ[t++]=ni}}}}
function routeTo(tg){const r=[];let c=tg;while(c!==bS&&c>=0){r.push(c);c=bP[c]}return r.reverse()}
function moveAlong(e,sp){while(sp>0&&e.route.length){const n=e.route[0];if(!S.path[n]){e.route.length=0;e.goal=0;return}const tx=n%N+0.5+e.ox,ty=(n/N|0)+0.5+e.oy,dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);if(d<=sp){e.x=tx;e.y=ty;e.prev=e.tile;e.tile=n;e.route.shift();sp-=d}else{e.x+=dx/d*sp;e.y+=dy/d*sp;sp=0}}}
function wander(e,n){e.route=[];e.goal=0;let cur=e.tile,prev=e.prev;for(let k=0;k<n;k++){const nb=[],x=cur%N,y=cur/N|0;for(let d=0;d<4;d++){const nx=x+DX[d],ny=y+DY[d];if(inb(nx,ny)&&S.path[idx(nx,ny)]&&!(nx===0&&e.role===undefined&&!e.leaving&&ny===S.EY))nb.push(idx(nx,ny))}if(!nb.length)break;let o=nb.filter(i=>i!==prev);if(!o.length)o=nb;const nx=pick(o);e.route.push(nx);prev=cur;cur=nx}e.idle=rnd(0.3,1.5)}
function placeAt(e,t){e.tile=t;e.x=t%N+0.5+e.ox;e.y=(t/N|0)+0.5+e.oy;e.route=[];e.prev=-1}
function rescue(e){for(let r=1;r<8;r++){const x0=e.tile%N,y0=e.tile/N|0;for(let y=y0-r;y<=y0+r;y++)for(let x=x0-r;x<=x0+r;x++)if(inb(x,y)&&S.path[idx(x,y)]){placeAt(e,idx(x,y));return}}placeAt(e,S.spawn)}

// ===== 遊客 =====
const SHIRTS=['#e8453c','#3b82f6','#2f9e44','#ffc83d','#e64980','#7048e8','#f08c00','#12b886','#f8f9fa','#495057'];
function say(g,key,text){const c=g.cd[key];if(c!==undefined&&S.t-c<20)return;g.cd[key]=S.t;const k0=g.th.indexOf(text);if(k0>=0)g.th.splice(k0,1);g.th.unshift(text);if(g.th.length>6)g.th.pop();const tc=S.tc[key]||(S.tc[key]={text,n:0});tc.text=text;tc.n++}
function capOf(o){return o.type==='coaster'?COASTER_DEFS[o.kind].cars*4:RIDE_DEFS[o.kind].cap}
function statsOf(o){return o.type==='coaster'?o.stats:RIDE_DEFS[o.kind]}
function fairFee(){let v=4;for(const o of attrList()){const s=statsOf(o);if(o.open&&o.acc.length&&s)v+=s.E*(o.type==='coaster'?2.2:1.2)}return Math.min(60,v)}
function arrivalRate(){let v=6;for(const o of attrList()){const s=statsOf(o);if(o.open&&o.acc.length&&s&&o.state!=='broken')v+=o.type==='coaster'?4+s.E*2.5:3+s.E*0.8}for(const o of LS.shop)if(o.acc.length)v+=0.6;v*=0.35+S.rating/850;const f=fairFee();if(S.fee>f)v*=clamp(1-(S.fee-f)/f,0.1,1);return Math.min(v,280)}
function spawnGuests(dt){if(!S.open||S.guests.length>=900)return;S.spawnAcc+=arrivalRate()*dt/DAY_LEN;while(S.spawnAcc>=1){S.spawnAcc-=1;trySpawn()}}
function trySpawn(){
 const cash=ri(25,90);if(S.fee>cash*0.6){S.stat.turned++;return}
 const g={id:S.gid++,x:0.5,y:S.EY+0.5,tile:S.spawn,route:[],goal:0,st:'walk',happy:rnd(55,80),energy:rnd(70,100),hunger:rnd(5,40),thirst:rnd(5,40),toilet:rnd(0,30),nausea:0,cash:cash-S.fee,iHi:rnd(2.5,9.5),nTol:rnd(2,7.5),stay:rnd(70,150),timeIn:0,ridden:{},th:[],cd:{},shirt:pick(SHIRTS),pants:pick(['#343a40','#1c3d6e','#5c3d2e','#495057']),skin:pick(['#f1c27d','#e0ac69','#ffdbac','#c68642']),carry:0,carryT:0,balloon:0,map:0,leaving:false,tm:rnd(0,1),ox:rnd(-0.28,0.28),oy:rnd(-0.28,0.28),qT:0,qo:0,qTile:-1,sitT:0,prev:-1,idle:0,spent:S.fee,nr:0};
 g.y+=g.oy;
 if(S.fee>fairFee()){g.happy-=10;say(g,'fee','門票有點貴')}
 if(S.fee>0)earn(S.fee,'ticket');
 S.guests.push(g);GM.set(g.id,g);S.stat.in++;
}
function guestStep(g,dt){
 g.timeIn+=dt;g.tm-=dt;if(g.tm<=0){g.tm+=1;needs(g)}
 if(g.st==='ride')return;
 if(g.st==='queue'){g.qT+=dt;if(g.qT>50)leaveQueue(g,true);return}
 if(g.st==='sit'||g.st==='buy'){g.sitT-=dt;if(g.st==='sit'){g.energy=Math.min(100,g.energy+dt*8);g.nausea=Math.max(0,g.nausea-dt*6)}if(g.sitT<=0)g.st='walk';return}
 if(!S.path[g.tile]){rescue(g);return}
 if(g.route.length){moveAlong(g,(g.energy<20?0.8:1.25)*dt);return}
 if(g.goal===-2){if(g.tile===S.spawn){g.gone=1;return}g.goal=0}
 if(g.goal){arrive(g);return}
 g.idle-=dt;if(g.idle<=0)decide(g);
}
function leaveQueue(g,imp){const o=S.objs[g.qo];if(o){const k=o.queue.indexOf(g.id);if(k>=0)o.queue.splice(k,1);if(imp){say(g,'ql'+o.id,`排${o.name}排太久了`);g.happy-=8}}g.st='walk';g.qo=0;if(g.qTile>=0)placeAt(g,g.qTile);g.idle=0.5}
function arrive(g){
 const id=g.goal;g.goal=0;
 if(id===-1){if(S.addon[g.tile]===1&&!S.brk[g.tile]){g.st='sit';g.sitT=rnd(4,8)}return}
 const o=S.objs[id];if(!o||!o.acc.includes(g.tile))return;
 if(o.type==='shop')return buy(g,o);
 if(!o.open||o.state==='broken'){say(g,'cl'+o.id,`${o.name}沒有開放，好失望`);g.happy-=4;return}
 if(o.queue.length>=capOf(o)*3){say(g,'ql'+o.id,`${o.name}排隊的人太多了`);return}
 o.queue.push(g.id);g.st='queue';g.qo=o.id;g.qT=0;g.qTile=g.tile;g.x=g.tile%N+rnd(0.15,0.85);g.y=(g.tile/N|0)+rnd(0.15,0.85);
}
function decide(g){
 if(!g.leaving&&(g.timeIn>g.stay||g.happy<12||g.energy<5||(g.cash<1&&g.timeIn>g.stay*0.4))){g.leaving=true;say(g,'home',g.happy<12?'這座樂園真無聊，我要回家了':g.cash<1?'錢花光了，該回家了':'玩得好累，該回家了')}
 bfs(g.tile);
 if(g.leaving){if(bD[S.spawn]>=0){g.route=routeTo(S.spawn);g.goal=-2;if(!g.route.length&&g.tile===S.spawn)g.gone=1}else wander(g,ri(2,5));return}
 let ch=null;
 if(g.toilet>65){ch=findShop(g,'toilet');if(!ch)say(g,'notoilet','找不到廁所！')}
 if(!ch&&g.hunger>55&&g.cash>=1){ch=findShop(g,'food');if(!ch&&g.hunger>75)say(g,'nofood','肚子好餓，附近卻沒有吃的')}
 if(!ch&&g.thirst>55&&g.cash>=1){ch=findShop(g,'drink');if(!ch&&g.thirst>75)say(g,'nodrink','好渴，找不到飲料')}
 if(!ch&&(g.energy<30||g.nausea>55))ch=findBench(g);
 if(!ch&&Math.random()<0.8){ch=findRide(g);if(!ch&&!attrList().some(o=>o.open&&o.acc.length))say(g,'none','這裡沒有什麼好玩的')}
 if(!ch&&!g.balloon&&g.cash>5&&Math.random()<0.15)ch=findShop(g,'souvenir');
 if(!ch&&!g.map&&g.cash>3&&Math.random()<0.06)ch=findShop(g,'map');
 if(ch){g.goal=ch.id;g.route=routeTo(ch.tile)}else wander(g,ri(2,6));
}
function nearestAcc(o){let bd=1e9,bt=-1;for(const a of o.acc){const v=bD[a];if(v>=0&&v<bd){bd=v;bt=a}}return[bt,bd]}
function findShop(g,sells){let best=null,bd=40;for(const o of LS.shop){const d=SHOP_DEFS[o.kind];if(d.sells!==sells||!o.open||o.price>g.cash)continue;const[t,v]=nearestAcc(o);if(t>=0&&v<bd){bd=v;best={id:o.id,tile:t}}}return best}
function findBench(g){let bt=-1,bd=15;for(let i=0;i<N*N;i++)if(S.addon[i]===1&&!S.brk[i]&&bD[i]>=0&&bD[i]<bd){bd=bD[i];bt=i}return bt>=0?{id:-1,tile:bt}:null}
function findRide(g){
 let best=null,bs=0;
 for(const o of attrList()){
  const st=statsOf(o);if(!o.open||o.state==='broken'||!o.acc.length||!st)continue;
  const[t,d]=nearestAcc(o);if(t<0)continue;
  if(st.I>g.iHi){if(d<8)say(g,'int'+o.id,`${o.name}看起來太刺激了`);continue}
  if(st.N>g.nTol-g.nausea/30)continue;
  if(o.price>g.cash)continue;
  if(o.price>0.5+st.E*0.9){if(d<10)say(g,'exp'+o.id,`${o.name}太貴了，不值得`);continue}
  const cnt=g.ridden[o.id]||0;
  const sc=(st.E+1)/(1+cnt*1.6)/(1+d/(g.map?40:20))/(1+o.queue.length/(capOf(o)*1.5))*rnd(0.6,1.4);
  if(sc>bs){bs=sc;best={id:o.id,tile:t}}
 }
 return best;
}
function buy(g,o){
 const d=SHOP_DEFS[o.kind];if(!o.open)return;
 if(o.price>g.cash){say(g,'poor','錢不夠了…');return}
 if(o.price>d.val){say(g,'exp'+o.id,`${o.name}的價格太貴了`);g.happy-=2;return}
 if(o.price>0){g.cash-=o.price;g.spent+=o.price;earn(o.price,'shop');o.income+=o.price}
 o.count++;if(d.cogs)pay(d.cogs,'stock');
 switch(d.sells){
  case'food':g.hunger=Math.max(0,g.hunger-d.fill);g.happy+=3;g.carry=1;g.carryT=rnd(3,8);break;
  case'drink':g.thirst=0;g.toilet+=20;g.happy+=2;g.carry=1;g.carryT=rnd(3,8);break;
  case'toilet':g.toilet=0;g.happy+=2;break;
  case'souvenir':g.balloon=pick(['#e8453c','#ffc83d','#3b82f6','#e64980','#2f9e44']);g.happy+=8;break;
  case'map':g.map=1;g.happy+=3;break;
 }
 g.happy=Math.min(100,g.happy);g.st='buy';g.sitT=d.sells==='toilet'?3:1.2;
}
function binNear(t){const x0=t%N,y0=t/N|0;for(let y=y0-2;y<=y0+2;y++)for(let x=x0-2;x<=x0+2;x++)if(inb(x,y)){const i=idx(x,y);if(S.addon[i]===2&&!S.brk[i])return true}return false}
function vomit(g){if(S.path[g.tile])S.vom[g.tile]=Math.min(5,S.vom[g.tile]+1);g.nausea=Math.max(0,g.nausea-45);g.happy-=6;say(g,'puke','我吐了…')}
function needs(g){
 const q=g.st==='ride'?0.3:1;
 g.hunger=Math.min(100,g.hunger+0.42*q);g.thirst=Math.min(100,g.thirst+0.5*q);g.toilet=Math.min(100,g.toilet+0.3);
 if(g.st==='walk')g.energy=Math.max(0,g.energy-0.28);else if(g.st==='queue')g.energy=Math.max(0,g.energy-0.12);
 g.nausea=Math.max(0,g.nausea-0.5);
 if(g.st==='ride')return;
 let dh=0;
 if(g.hunger>80){dh-=0.3;say(g,'hungry','我好餓…')}
 if(g.thirst>80){dh-=0.3;say(g,'thirsty','好渴，想喝點東西')}
 if(g.toilet>85){dh-=0.5;say(g,'wc','我急著上廁所！')}
 if(g.energy<15){dh-=0.2;say(g,'tired','走得好累')}
 if(g.nausea>60){dh-=0.25;say(g,'sickish','我覺得有點想吐')}
 if(g.st==='queue'&&g.qT>25)dh-=0.15;
 const t=g.tile,x=t%N,y=t/N|0;let lit=S.lit[t],vm=S.vom[t];
 for(let d=0;d<4;d++){const nx=x+DX[d],ny=y+DY[d];if(inb(nx,ny)){const j=idx(nx,ny);lit+=S.lit[j];vm+=S.vom[j]}}
 if(lit>=6){dh-=0.35;say(g,'dirty','這裡的路好髒')}
 if(vm){dh-=0.5;say(g,'vomit','地上有嘔吐物，好噁心')}
 if(S.brk[t]){dh-=0.15;say(g,'vandal','公物被破壞了，看起來好糟')}
 if(beauty[t]>=3){dh+=0.12;if(Math.random()<0.05)say(g,'pretty','這裡的景色真漂亮')}
 if(entMap[t]){dh+=0.4;if(Math.random()<0.1)say(g,'show','表演好有趣！')}
 g.happy=clamp(g.happy+dh,0,100);
 if(g.carry){g.carryT-=1;if(g.carryT<=0){g.carry=0;if(!binNear(t)&&S.path[t])S.lit[t]=Math.min(12,S.lit[t]+1)}}
 else if(Math.random()<0.0015&&S.path[t])S.lit[t]=Math.min(12,S.lit[t]+1);
 if(g.happy<25&&S.addon[t]&&!S.brk[t]&&!secMap[t]&&Math.random()<0.05){S.brk[t]=1;say(g,'angry','這破地方！');if(Math.random()<0.3)msg('有遊客破壞了公物，考慮雇用警衛',t)}
 if(g.nausea>80&&g.st==='walk'&&Math.random()<0.08)vomit(g);
}

// ===== 設施運作 =====
function rideStep(o,dt){
 if(o.type==='coaster'&&(!o.complete||!o.stats))return;
 if(o.state==='broken')return;
 o.timer+=dt;
 if(o.state==='loading'){
  if(!o.open){o.timer=0;return}
  const cp=capOf(o);
  while(o.riders.length<cp&&o.queue.length){const g=GM.get(o.queue.shift());if(!g||g.st!=='queue')continue;if(g.cash<o.price){g.st='walk';g.qo=0;placeAt(g,g.qTile);say(g,'poor','錢不夠玩'+o.name);continue}if(o.price>0){g.cash-=o.price;g.spent+=o.price;earn(o.price,'ride');o.income+=o.price}o.count++;g.st='ride';g.qo=0;o.riders.push(g.id)}
  if(o.riders.length&&(o.riders.length>=cp||o.timer>6)){o.state='running';o.timer=0;if(o.type==='coaster')o.tr={s:CC.get(o.id).sHome,v:2.2,arr:false}}
  else if(!o.riders.length)o.timer=0;
 }else if(o.state==='running'){
  o.phase+=dt;
  if(o.type==='coaster')trainStep(o,dt);else if(o.timer>=RIDE_DEFS[o.kind].cycle)endRun(o);
 }
}
function endRun(o){
 const st=statsOf(o);
 for(const id of o.riders){const g=GM.get(id);if(!g)continue;g.st='walk';placeAt(g,g.qTile>=0&&S.path[g.qTile]?g.qTile:(o.acc[0]??S.spawn));g.ridden[o.id]=(g.ridden[o.id]||0)+1;g.nr++;
  const over=Math.max(0,st.I-g.iHi);g.happy=clamp(g.happy+clamp(5+st.E*2.2-over*6,-15,25),0,100);g.nausea=Math.min(100,g.nausea+st.N*7);g.energy=Math.max(0,g.energy-3);

const DH={station:0,straight:0,left:0,right:0,up:1,down:-1,lift:1,up2:2,down2:-2};
const PIECE_NAMES={straight:'直線',left:'左彎',right:'右彎',up:'上坡',down:'下坡',lift:'鏈條上坡',up2:'陡上坡',down2:'陡下坡'};
function exitOf(p){const d2=p.t==='left'?(p.d+3)%4:p.t==='right'?(p.d+1)%4:p.d;return{x:p.x+DX[d2],y:p.y+DY[d2],d:d2,h:p.h0+DH[p.t]}}
function cursorOf(c){return exitOf(c.pieces[c.pieces.length-1])}
function pieceOk(x,y,d,h,t){
 const h1=h+DH[t];if(!inb(x,y)||h<0||h1<0||h1>MAXH)return false;

 if(S.occ[i]){const o=S.objs[S.occ[i]];if(!o||o.type!=='scen')return false}
 if(t==='station'&&S.terr[i])return false;
 const lo=Math.min(h,h1),hi=Math.max(h,h1);
 if((S.path[i]||i===S.spawn)&&lo<3)return false;

}

 for(let k=0;k<3;k++)if(!pieceOk(x+DX[d]*k,y+DY[d]*k,d,0,'station')){msg('這裡無法放置車站');return}
 if(!spend(def.station*3,'build'))return;
 const n=LS.coaster.filter(c=>c.kind===kind).length+1;
 const c=addObj({type:'coaster',kind,name:def.name+' '+n,pieces:[],complete:false,open:false,price:def.price,state:'loading',timer:0,phase:0,queue:[],riders:[],rel:100,mech:0,count:0,income:0,stats:null,spent:def.station*3,acc:[],lastInsp:0,tr:null});
 for(let k=0;k<3;k++){const px=x+DX[d]*k,py=y+DY[d]*k;clearTree(idx(px,py));c.pieces.push({x:px,y:py,d,h0:0,t:'station'})}

}
function pieceCost(c,t){return COASTER_DEFS[c.kind].piece+(t==='lift'?20:0)+(t==='up2'||t==='down2'?10:0)}
function addPiece(c,t,quiet){
 if(c.complete)return false;
 if((t==='up2'||t==='down2')&&!S.unl.steep){msg('陡坡軌道尚未研發');return false}
 const cu=cursorOf(c),def=COASTER_DEFS[c.kind];
 if(cu.h+DH[t]>def.maxH){if(!quiet)msg(`${def.name}最高只能到 ${def.maxH} 層`);return false}
 if(!pieceOk(cu.x,cu.y,cu.d,cu.h,t)){if(!quiet)msg('前方被擋住或高度不足，無法延伸');return false}
 const cost=pieceCost(c,t);if(!spend(cost,'build'))return false;
 clearTree(idx(cu.x,cu.y));
 c.pieces.push({x:cu.x,y:cu.y,d:cu.d,h0:cu.h,t});c.spent+=cost;
 if(!quiet){afterTrackChange(c);checkComplete(c)}

}
function checkComplete(c){

  c.complete=true;afterTrackChange(c);testCoaster(c);
  msg(`${c.name} 軌道完成！測試結果：興奮度 ${c.stats.E.toFixed(2)}`,idx(p0.x,p0.y));
  if(c.stats.stall>=0)msg('注意：列車在途中動力不足，建議加入鏈條上坡');

}
function removeLast(c){

function afterTrackChange(c){rebuildTrack();buildPts(c);recomputeAccess()}
function samplePiece(p){
 const out=[],dI=p.d,cx=p.x+0.5,cy=p.y+0.5,h1=p.h0+DH[p.t];
 if(p.t==='left'||p.t==='right'){
  const dO=p.t==='left'?(dI+3)%4:(dI+1)%4;const kx=cx-0.5*DX[dI]+0.5*DX[dO],ky=cy-0.5*DY[dI]+0.5*DY[dO];
  for(let k=0;k<=8;k++){const a=k/8*Math.PI/2,c=Math.cos(a),s=Math.sin(a);out.push({x:kx+0.5*(-DX[dO]*c+DX[dI]*s),y:ky+0.5*(-DY[dO]*c+DY[dI]*s),z:p.h0})}
 }else for(let k=0;k<=8;k++){const f=k/8;out.push({x:cx+(f-0.5)*DX[dI],y:cy+(f-0.5)*DY[dI],z:p.h0+(h1-p.h0)*f})}

}
const d3=(a,b)=>Math.hypot((a.x-b.x)*4,(a.y-b.y)*4,(a.z-b.z)*1.5);
function buildPts(c){
 const pts=[],ps=[];let cum=0,last=null;
 c.pieces.forEach((p,pi)=>{const sm=samplePiece(p);ps.push(sm);for(let k=0;k<sm.length-1;k++){const q=sm[k];if(last)cum+=d3(last,q);pts.push({x:q.x,y:q.y,z:q.z,cum,pi});last=q}});
 if(!c.pieces.length)return;
 const end=ps[ps.length-1][8];cum+=d3(last,end);
 CC.set(c.id,{pts,ps,total:cum,end,sHome:10.8});
}
function posAt(cc,s){const T=cc.total;s=((s%T)+T)%T;const P=cc.pts;let lo=0,hi=P.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(P[m].cum<=s)lo=m;else hi=m-1}const a=P[lo],b=lo+1<P.length?P[lo+1]:{x:cc.end.x,y:cc.end.y,z:cc.end.z,cum:T};const f=(s-a.cum)/Math.max(1e-6,b.cum-a.cum);return{x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f,z:a.z+(b.z-a.z)*f,pi:a.pi}}
const zAt=(cc,s)=>posAt(cc,s).z*1.5;
function accel(c,cc,s,v){const L=COASTER_DEFS[c.kind].cars*3.2,gr=(zAt(cc,s)-zAt(cc,s-L))/L;return -9.81*gr-COASTER_DEFS[c.kind].fr*9.81-0.0012*v*v}
function boostAt(c,cc,s){const L=COASTER_DEFS[c.kind].cars*3.2;let st=false;for(const f of[0,0.5,1]){const t=c.pieces[posAt(cc,s-L*f).pi].t;if(t==='lift')return 2.4;if(t==='station'&&f===0)st=true}return st?2.2:0}
function trainStep(c,dt){
 const cc=CC.get(c.id),tr=c.tr;if(!cc||!tr)return;
 for(let k=0;k<2;k++){const h=dt/2;
  if(!tr.arr){let v=Math.max(tr.v+accel(c,cc,tr.s,tr.v)*h,boostAt(c,cc,tr.s));if(v<1)v=1;tr.v=v;tr.s+=v*h;if(tr.s>=cc.total){tr.s-=cc.total;tr.arr=true}}
  else{tr.v=Math.max(1.2,Math.min(tr.v,(cc.sHome-tr.s)*1.5+1.2));tr.s+=tr.v*h;if(tr.s>=cc.sHome){tr.s=cc.sHome;tr.v=0;endRun(c);return}}
 }
}
function testCoaster(c){
 const cc=CC.get(c.id),def=COASTER_DEFS[c.kind];
 let s=cc.sHome,v=2.2,maxV=0,maxLat=0,maxG=1,air=0,drops=0,maxDrop=0,stall=-1,t=0,desc=0,prevZ=zAt(cc,s);
 let turns=0,steep=0;for(const p of c.pieces){if(p.t==='left'||p.t==='right')turns++;if(p.t==='up2'||p.t==='down2')steep++}
 const dt=0.02;
 for(let i=0;i<60000;i++){
  v=Math.max(v+accel(c,cc,s,v)*dt,boostAt(c,cc,s));
  if(v<0.6){if(stall<0)stall=posAt(cc,s).pi;v=1}
  s+=v*dt;t+=dt;if(s>=cc.total)break;
  const z=zAt(cc,s);if(z<prevZ-1e-6)desc+=prevZ-z;else if(z>prevZ+1e-6){if(desc>=3){drops++;maxDrop=Math.max(maxDrop,desc)}desc=0}prevZ=z;
  maxV=Math.max(maxV,v);
  const p2=c.pieces[posAt(cc,s).pi];if(p2.t==='left'||p2.t==='right')maxLat=Math.max(maxLat,v*v/(6*9.81));
  const g1=(zAt(cc,s+6)-z)/6,g0=(z-zAt(cc,s-6))/6,vg=1+v*v*((g1-g0)/6)/9.81;maxG=Math.max(maxG,vg);if(vg<0.3&&v>4)air+=dt;
 }

 const kmh=maxV*3.6;

 const I=(0.4+kmh*0.045+Math.min(maxLat,6)*0.9+Math.max(0,Math.min(maxG,6)-1)*0.5+maxDrop*0.03+steep*0.05)*def.Im;

 c.stats={E:clamp(E,0,12),I:clamp(I,0,15),N:clamp(Nn,0,10),maxV:kmh,len:cc.total,drops,maxDrop,air,maxLat,maxG,time:t,stall};

function autoRoute(c){
 const p0=c.pieces[0],cu=cursorOf(c),MH=COASTER_DEFS[c.kind].maxH,HN=MH+1;

 const types=['straight','left','right','down'];if(S.unl.steep)types.push('down2');
 const prev=new Int32Array(N*N*4*HN).fill(-1),how=new Int8Array(N*N*4*HN),q=[start];prev[start]=start;
 let found=start===goal;
 for(let qi=0;qi<q.length&&!found;qi++){
  const s=q[qi];const h=s%HN,r=(s-h)/HN,d=r%4,ti=(r-d)/4,x=ti%N,y=(ti-x)/N;
  for(let k=0;k<types.length;k++){const t=types[k];if(!pieceOk(x,y,d,h,t))continue;const e=exitOf({x,y,d,h0:h,t});if(!inb(e.x,e.y)||e.h<0||e.h>MH)continue;const ns=enc(e.x,e.y,e.d,e.h);if(prev[ns]!==-1)continue;prev[ns]=s;how[ns]=k;if(ns===goal){found=true;break}q.push(ns)}

function doAuto(c){

function staffStep(s,dt){
 if(s.work>0){s.work-=dt;if(s.work<=0)finishWork(s);return}

 if(s.route.length){moveAlong(s,1.35*dt);return}

 if(s.role==='handyman'){
  if(S.lit[t]||S.vom[t]||S.brk[t]){s.work=S.vom[t]||S.brk[t]?2:1.2;s.task=S.brk[t]?'修理公物':'打掃中';return}
  bfs(t);let best=-1,bd=22;for(let i=0;i<N*N;i++){const v=bD[i];if(v>0&&v<bd&&(S.lit[i]>=2||(S.lit[i]&&v<5)||S.vom[i]||S.brk[i])){bd=v;best=i}}

  s.task='待命中';wander(s,ri(3,8));

}
function pickJob(s){

function placeFoot(tl,hx,hy){
 if(tl.cat==='ride'){const d=RIDE_DEFS[tl.kind],w=tl.rot%2?d.h:d.w,h=tl.rot%2?d.w:d.h,x=hx-Math.floor(w/2),y=hy-Math.floor(h/2),t=[];for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)t.push([i,j]);return{tiles:t,obj:{type:'ride',kind:tl.kind,x,y,w,h}}}
 return{tiles:[[hx,hy]],obj:{type:tl.cat,kind:tl.kind,x:hx,y:hy,w:1,h:1}};
}
function canPlace(tl,fp){
 const water=tl.cat==='ride'&&RIDE_DEFS[tl.kind].water;
 for(const[x,y]of fp.tiles){if(!inb(x,y)||x<1)return false;const i=idx(x,y);if(S.path[i]||trackAt[i]||i===S.spawn)return false;if(S.occ[i]){const o=S.objs[S.occ[i]];if(!(o.type==='scen'&&tl.cat!=='scen'))return false}if(water?S.terr[i]!==1:S.terr[i]!==0)return false}
 return true;
}
function doPlace(tl,hx,hy){
 const fp=placeFoot(tl,hx,hy);if(!canPlace(tl,fp)){msg(tl.cat==='ride'&&RIDE_DEFS[tl.kind].water?'水上設施必須整個放在水面上':'這裡無法放置');return}
 const def=tl.cat==='ride'?RIDE_DEFS[tl.kind]:tl.cat==='shop'?SHOP_DEFS[tl.kind]:SCEN_DEFS[tl.kind];
 if(!spend(def.cost,tl.cat==='scen'?'build':'build'))return;
 for(const[x,y]of fp.tiles)clearTree(idx(x,y));
 const o=fp.obj;
 if(tl.cat==='ride')Object.assign(o,{name:def.name+' '+(LS.ride.filter(r=>r.kind===tl.kind).length+1),price:def.price,open:true,state:'loading',timer:0,phase:0,queue:[],riders:[],rel:100,mech:0,count:0,income:0,acc:[],cost:def.cost,lastInsp:0});
 else if(tl.cat==='shop')Object.assign(o,{name:def.name+' '+(LS.shop.filter(r=>r.kind===tl.kind).length+1),price:def.price,open:true,count:0,income:0,acc:[],cost:def.cost});
 addObj(o);afterChange();
 if(tl.cat!=='scen'&&!o.acc.length)msg(`${o.name} 還沒有連接道路，記得在旁邊鋪路`,idx(o.x,o.y));
}
function placePath(hx,hy){
 if(!inb(hx,hy))return;const i=idx(hx,hy);if(S.path[i])return;
 if(S.terr[i]===1){if(!UI.warned){msg('道路不能鋪在水面上');UI.warned=1}return}
 if(S.occ[i]){const o=S.objs[S.occ[i]];if(o.type!=='scen')return;}
 const ta=trackAt[i];if(ta&&ta.some(q=>q.lo<3))return;

}

  case'selstaff':openPanel('staffone',+v);break;
  case'toggle':if(o){if(o.type==='coaster'&&!o.complete)break;o.open=!o.open;if(!o.open){releaseQueue(o,null)}msg(`${o.name} ${o.open?'開放營運':'已關閉'}`)}break;
  case'price':if(o){o.price=clamp(Math.round((o.price+ +v)*2)/2,0,20)}break;
  case'demo':{const t=S.objs[+v];if(!t)break;if(t.type==='coaster')confirmBox(`拆除「${t.name}」？將退還 ${money(t.spent*0.5)}`,'拆除',()=>demolishCoaster(t));else confirmBox(`拆除「${t.name}」？將退還 ${money(t.cost*0.5)}`,'拆除',()=>demolishObj(t));break}
  case'hire':hire(v);break;
  case'fire':fire(+v);break;
  case'fund':S.res.fund=+v;break;
  case'rcat':S.res.cats[v]=S.res.cats[v]?0:1;break;
  case'loan':{const d=+v;if(d>0){if(S.loan+d>30000){msg('已達貸款上限');break}S.loan+=d;S.cash+=d}else{if(S.loan<=0)break;if(S.cash<1000){msg('資金不足以還款');break}S.loan-=1000;S.cash-=1000}break}
  case'fee':S.fee=clamp(S.fee+ +v,0,80);break;
  case'parkopen':S.open=!S.open;msg(S.open?'樂園開放了！':'樂園已關閉，不再有新遊客入園');break;
  case'save':save(false);break;
  case'load':if(!load())msg('沒有可讀取的存檔');closePanel();break;
  case'newgame':closePanel();showStart();break;
 }
 renderPanel();updateHUD();
}
function closePanelKeepTool(){UI.panel=null;$('#panel').hidden=true}
function focusObj(o){if(!o)return;if(o.type==='coaster'){const p=o.pieces[1]||o.pieces[0];centerOn(p.x+0.5,p.y+0.5)}else centerOn(o.x+(o.w||1)/2,o.y+(o.h||1)/2)}
function centerOn(x,y){const[sx,sy]=iso(x,y);cam.x=W/2-sx*cam.z;cam.y=H/2-sy*cam.z}
function updateHUD(){
 if(!S)return;const c=$('#cash');c.textContent=money(S.cash);c.classList.toggle('neg',S.cash<0);
 $('#gcount').textContent=S.guests.length;$('#rating').textContent=Math.round(S.rating);
 const hr=9+Math.floor(S.dayT/DAY_LEN*12),mn=Math.floor((S.dayT/DAY_LEN*12%1)*60/10)*10;
 $('#date').textContent=`第${S.year}年 ${MONTHS[S.month]} ${S.day+1}日 ${hr}:${String(mn).padStart(2,'0')}`;
 $('#pname').textContent=S.name;
 document.querySelectorAll('#spd button').forEach(b=>b.classList.toggle('on',+b.dataset.spd===S.speed));
 renderTicker();
}

// ===== 對話框 =====
const modal=$('#modal');let mfn=null;
function showModal(html){modal.innerHTML=html;modal.hidden=false;UI.modal=true}
function hideModal(){modal.hidden=true;UI.modal=false}
function confirmBox(text,ok,fn){mfn=fn;showModal(`<div class="card" style="max-width:420px"><div class="in"><p style="font-size:16px">${esc(text)}</p><div class="row"><button data-m="ok" class="on">${esc(ok)}</button><button data-m="no">取消</button></div></div></div>`)}
const HERO_SVG='<svg viewBox="0 0 280 130"><g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="M0 120 C40 120 50 20 90 20 S130 100 160 100 S200 40 230 40 S270 90 290 90"/><path d="M0 128 C40 128 50 28 90 28 S130 108 160 108 S200 48 230 48 S270 98 290 98" opacity=".5"/></g><g stroke="#ffd8a8" stroke-width="2"><path d="M90 28V130M160 108V130M230 48V130M60 80V130M200 70V130"/></g><g fill="#ffc83d"><rect x="80" y="10" width="22" height="12" rx="3"/><rect x="104" y="20" width="22" height="12" rx="3" transform="rotate(30 115 26)"/></g></svg>';
function showStart(){
 S&&save(true);
 const sv=hasSave();
 showModal(`<div class="card"><div class="hero"><h1>樂園大亨</h1><p>蓋雲霄飛車、經營你的夢想遊樂園</p>${HERO_SVG}</div><div class="in">
 ${sv?'<div class="row" style="margin-bottom:12px"><button data-m="cont" class="on">繼續上次的存檔</button></div>':''}
 <h4 style="margin:0 0 8px">選擇關卡</h4><div class="scns">${SCENS.map((s,i)=>`<button class="scn" data-m="new" data-v="${i}"><b>${s.name}</b><span>${s.desc}</span><em>目標：第 ${s.goal.year} 年十月底前 遊客 ${s.goal.guests} 人、評價 ${s.goal.rating}</em><span>起始資金 ${money(s.cash)}（含貸款 ${money(s.loan)}）</span></button>`).join('')}</div>
 <div class="help">玩法：從入口鋪設道路 → 在道路旁蓋設施與商店 → 雇用清潔工和技工 → 調整票價、投入研發解鎖新設施。<br>雲霄飛車：放置車站後逐段延伸軌道，用「鏈條上坡」拉高再衝下坡，最後接回車站（可按「自動接回車站」）。</div></div></div>`);
}
function showEnd(ok){
 S.speed=0;
 showModal(`<div class="card" style="max-width:480px"><div class="hero" style="${ok?'':'background:linear-gradient(160deg,#5c677d,#343a40)'}"><h1>${ok?'目標達成！':'目標未達成'}</h1><p>${ok?`恭喜！${esc(S.name)}成為人氣樂園`:'時間到了，再接再厲'}</p></div><div class="in"><div class="kv"><span>園內遊客</span><span class="num">${S.guests.length} / ${S.goal.guests}</span><span>樂園評價</span><span class="num">${Math.round(S.rating)} / ${S.goal.rating}</span><span>資金</span><span class="num">${money(S.cash)}</span></div><div class="row" style="margin-top:14px"><button data-m="keep" class="on">繼續經營</button><button data-m="menu">回到關卡選擇</button></div></div></div>`);
}
modal.addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;const m=b.dataset.m;
 if(m==='ok'){hideModal();mfn&&mfn();mfn=null;renderPanel()}else if(m==='no'){hideModal();mfn=null}
 else if(m==='new'){hideModal();newGame(+b.dataset.v);setTool('select');closePanel();updateHUD()}
 else if(m==='cont'){hideModal();if(!load())newGame(0);setTool('select');updateHUD()}
 else if(m==='keep'){hideModal();S.speed=1;updateHUD()}else if(m==='menu')showStart()});

// ===== 輸入 =====
const ptrs=new Map();let drag=null,pinch=null;
function toTile(px,py){const wx=(px-cam.x)/cam.z,wy=(py-cam.y)/cam.z;return[(wx/32+wy/16)/2,(wy/16-wx/32)/2]}
function zoomAt(px,py,f){const nz=clamp(cam.z*f,0.4,2.4),wx=(px-cam.x)/cam.z,wy=(py-cam.y)/cam.z;cam.z=nz;cam.x=px-wx*nz;cam.y=py-wy*nz}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
 if(!S)return;cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};drag=null;return}
 const paint=e.button===0&&UI.tool.mode==='path'&&e.pointerType==='mouse';
 drag={sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y,moved:false,btn:e.button,paint};
 if(paint){const[fx,fy]=toTile(e.clientX,e.clientY);placePath(Math.floor(fx),Math.floor(fy))}
});
cv.addEventListener('pointermove',e=>{
 if(!S)return;const[fx,fy]=toTile(e.clientX,e.clientY);UI.hover=[Math.floor(fx),Math.floor(fy)];
 if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;cam.x+=mx-pinch.mx;cam.y+=my-pinch.my;zoomAt(mx,my,d/pinch.d);pinch={d,mx,my};return}
 if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
 if(!drag.moved&&Math.hypot(dx,dy)>6)drag.moved=true;
 if(drag.paint)placePath(UI.hover[0],UI.hover[1]);else if(drag.moved){cam.x=drag.cx+dx;cam.y=drag.cy+dy}
});
function endPtr(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!drag)return;const d=drag;drag=null;if(d.moved&&!d.paint)return;if(d.btn===2){setTool('select');return}if(d.btn===0)clickAt(e.clientX,e.clientY)}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);drag=null;pinch=null});
cv.addEventListener('pointerleave',()=>{if(!drag)UI.hover=null});
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:1/1.12)},{passive:false});
function clickAt(px,py){
 const[fx,fy]=toTile(px,py),hx=Math.floor(fx),hy=Math.floor(fy),tl=UI.tool;
 switch(tl.mode){
  case'path':placePath(hx,hy);return;
  case'place':doPlace(tl,hx,hy);return;
  case'addon':placeAddon(hx,hy,tl.a);return;
  case'station':placeStation(tl.kind,hx,hy,tl.rot);return;
  case'demolish':demolishAt(hx,hy);return;
 }
 const wx=(px-cam.x)/cam.z,wy=(py-cam.y)/cam.z;
 let best=null,bd=12;
 for(const s of S.staff){const[sx,sy]=iso(s.x,s.y);const d=Math.hypot(sx-wx,sy-8-wy);if(d<bd){bd=d;best={k:'staff',id:s.id}}}
 for(const g of S.guests){if(g.st==='ride')continue;const[sx,sy]=iso(g.x,g.y);const d=Math.hypot(sx-wx,sy-8-wy);if(d<bd){bd=d;best={k:'guest',id:g.id}}}
 if(best){openPanel(best.k==='staff'?'staffone':'guest',best.id);return}
 if(inb(hx,hy)&&S.occ[idx(hx,hy)]){const o=S.objs[S.occ[idx(hx,hy)]];if(o.type==='ride'||o.type==='shop'){openPanel('obj',o.id);return}if(o.type==='gate'){openPanel('park');return}}
 for(const c of LS.coaster){const cc=CC.get(c.id);if(!cc)continue;for(const sm of cc.ps){const[sx,sy]=iso(sm[4].x,sm[4].y,sm[4].z);if(Math.hypot(sx-wx,sy-wy)<20){if(tl.mode==='track'&&tl.id===c.id)return;openPanel(c.complete?'obj':'obj',c.id);return}}}
 if(tl.mode!=='track')closePanel();
}
const keys=new Set();
addEventListener('keydown',e=>{if(!S||UI.modal)return;const k=e.key.toLowerCase();
 if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){keys.add(k);e.preventDefault()}
 else if(k==='escape'){if(UI.tool.mode!=='select')setTool('select');else closePanel()}
 else if(k==='r')rotateTool();else if(k===' '){S.speed=S.speed?0:1;updateHUD();e.preventDefault()}
 else if(k==='1'||k==='2'||k==='3'){S.speed=[1,2,4][+k-1];updateHUD()}});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>keys.clear());
function keyPan(dt){const v=700*dt;if(keys.has('arrowleft')||keys.has('a'))cam.x+=v;if(keys.has('arrowright')||keys.has('d'))cam.x-=v;if(keys.has('arrowup')||keys.has('w'))cam.y+=v;if(keys.has('arrowdown')||keys.has('s'))cam.y-=v}
document.querySelectorAll('#tools button').forEach(b=>b.addEventListener('click',()=>{if(!S)return;const t=b.dataset.tool;
 if(t==='path'||t==='demolish'){if(UI.tool.mode===t)setTool('select');else{setTool(t);closePanelKeepTool()}return}
 if(UI.panel&&UI.panel.kind===t){closePanel();return}
 if(UI.tool.mode!=='select')setTool('select');openPanel(t)}));
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>S&&openPanel(b.dataset.open)));
document.querySelectorAll('#spd button').forEach(b=>b.addEventListener('click',()=>{if(!S)return;S.speed=+b.dataset.spd;updateHUD()}));
$('#pclose').addEventListener('click',closePanel);
$('#hend').addEventListener('click',()=>{setTool('select');if(UI.panel&&UI.panel.kind==='build')closePanel()});
$('#hrot').addEventListener('click',rotateTool);
const pb=$('#pbody');
pb.addEventListener('pointerdown',()=>UI.pdown=true);addEventListener('pointerup',()=>setTimeout(()=>UI.pdown=false,0));
pb.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)act(b.dataset.act,b.dataset.v)});
$('#ticker').addEventListener('click',e=>{const d=e.target.closest('[data-tile]');if(d&&+d.dataset.tile>=0){const t=+d.dataset.tile;centerOn(t%N+0.5,(t/N|0)+0.5)}});
addEventListener('resize',()=>{const cx=W/2,cy=H/2;resize();cam.x+=W/2-cx;cam.y+=H/2-cy});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',readSky);
new MutationObserver(readSky).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

// ===== 主迴圈 =====
let last=performance.now(),accT=0,lastUI=0;
function frame(now){
 const rdt=Math.min(0.1,(now-last)/1000);last=now;
 if(S&&!UI.modal&&S.speed>0){accT+=rdt*S.speed;let n=0;while(accT>=0.05&&n<120){sim(0.05);accT-=0.05;n++}if(n>=120)accT=0}
 if(S)keyPan(rdt);
 try{render(now)}catch(e){console.error(e)}
 if(now-lastUI>250){lastUI=now;updateHUD();if(UI.panel&&LIVE.has(UI.panel.kind)&&!UI.pdown)renderPanel()}
 requestAnimationFrame(frame);
}
resize();readSky();
newGame(0);S.speed=0;S.preview=true;
showStart();
requestAnimationFrame(frame);
window.__park={get S(){return S},sim,newGame,setTool,doPlace,placePath,placeStation,addPiece,doAuto,hire,act,openPanel,centerOn,cam,CC,load,save,placeAddon};
}
</script>
</body>
